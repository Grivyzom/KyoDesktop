[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
api = { workspace = true }
tokio = { version = "1", features = ["time", "sync", "fs", "process", "io-util", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
eventsource-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rfd = "0.17"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Media", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams"] }

[features]
server = ["api/server"]
